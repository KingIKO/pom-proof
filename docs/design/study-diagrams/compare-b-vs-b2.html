<div class="cmp-top"><h1>Study diagrams: B and B2</h1><p>B is the tinted option as first shown. B2 keeps its tints and pass and fail colours, with fewer lines and labels, a clean amber in place of the beige, and more space.</p></div>
<div class="cmp"><h2 class="cmp-head">B: Tinted</h2><h2 class="cmp-head">B2: Tinted, calmer</h2>
<h2 class="cmp-row">Test shapes</h2><div><figure class="dg" data-card data-style="b">
<figcaption><span class="dg-title">Where each shape puts the effort</span><span class="dg-note">Wider bars get more tests. Broad tests sit at the top. Widths show emphasis, not measured ratios.</span></figcaption>
<div class="dg-shapes-row"><section class="dg-shape" aria-label="Pyramid"><h3>Pyramid</h3><ol class="dg-layers"><li style="--w:0.34">UI</li><li style="--w:0.64">Service</li><li style="--w:1" data-most>Unit</li></ol></section><section class="dg-shape" aria-label="Trophy"><h3>Trophy</h3><ol class="dg-layers"><li style="--w:0.4">End to end</li><li style="--w:1" data-most>Integration</li><li style="--w:0.6">Unit</li><li style="--w:0.8">Static</li></ol></section><section class="dg-shape" aria-label="Honeycomb"><h3>Honeycomb</h3><ol class="dg-layers"><li style="--w:0.5">Integrated</li><li style="--w:1" data-most>Integration</li><li style="--w:0.5">Implementation detail</li></ol></section></div></figure></div><div><figure class="dg" data-card data-style="b2" data-diagram="test-shapes">
<figcaption><span class="dg-title">Where each shape puts the effort</span><span class="dg-note">Wider bars mean more tests. Widths are not measured.</span></figcaption>
<div class="dg-shapes-row"><section class="dg-shape" aria-label="Pyramid"><h3>Pyramid</h3><ol class="dg-layers"><li style="--w:0.34">UI</li><li style="--w:0.64">Service</li><li style="--w:1" data-most>Unit</li></ol></section><section class="dg-shape" aria-label="Trophy"><h3>Trophy</h3><ol class="dg-layers"><li style="--w:0.4">End‑to‑end</li><li style="--w:1" data-most>Integration</li><li style="--w:0.6">Unit</li><li style="--w:0.8">Static</li></ol></section><section class="dg-shape" aria-label="Honeycomb"><h3>Honeycomb</h3><ol class="dg-layers"><li style="--w:0.5">Integrated</li><li style="--w:1" data-most>Integration</li><li style="--w:0.5">Implementation detail</li></ol></section></div></figure></div>
<h2 class="cmp-row">Number line</h2><div><figure class="dg" data-card data-style="b">
<figcaption><span class="dg-title">Partitions and boundary values</span><span class="dg-note">The rule changes between 9 and 10, and between 20 and 21. Filled squares are the 2-value checks. Hollow squares are the values 3-value BVA adds.</span></figcaption>
<div class="dg-line dg-line-wide">
<span class="dg-label" style="grid-row:1">Partition</span>
<div class="dg-band" style="grid-column:2 / span 5"><strong>Reject</strong>9 or less</div>
<div class="dg-band accept" style="grid-column:7 / span 11"><strong>Accept</strong>10 through 20</div>
<div class="dg-band" style="grid-column:18 / span 5"><strong>Reject</strong>21 or more</div>

<span class="dg-label" style="grid-row:3">2-value BVA</span><span class="dg-mark two" style="grid-column:6">9</span><span class="dg-mark two" style="grid-column:7">10</span><span class="dg-mark two" style="grid-column:17">20</span><span class="dg-mark two" style="grid-column:18">21</span>
<span class="dg-label" style="grid-row:4">3-value adds</span><span class="dg-mark three" style="grid-column:5">8</span><span class="dg-mark three" style="grid-column:8">11</span><span class="dg-mark three" style="grid-column:16">19</span><span class="dg-mark three" style="grid-column:19">22</span>
<span class="dg-edge" style="grid-column:7" aria-hidden="true"></span><span class="dg-edge" style="grid-column:18" aria-hidden="true"></span>
</div>
<div class="dg-line-narrow">
<ul class="dg-legend"><li><span class="dg-mark two" aria-hidden="true"></span>2-value BVA</li><li><span class="dg-mark three" aria-hidden="true"></span>3-value adds</li></ul>
<h3>Lower edge</h3><div class="dg-seg">
<div class="dg-band" style="grid-column:1 / span 3"><strong>Reject</strong>9 or less</div>
<div class="dg-band accept" style="grid-column:4 / span 3"><strong>Accept</strong>from 10</div>
<span class="dg-axis"></span><span class="dg-num" style="grid-column:1">7</span><span class="dg-num" style="grid-column:2">8</span><span class="dg-num" style="grid-column:3">9</span><span class="dg-num" style="grid-column:4">10</span><span class="dg-num" style="grid-column:5">11</span><span class="dg-num" style="grid-column:6">12</span><span class="dg-mark two" style="grid-column:3">9</span><span class="dg-mark two" style="grid-column:4">10</span><span class="dg-mark three" style="grid-column:2">8</span><span class="dg-mark three" style="grid-column:5">11</span>
<span class="dg-edge" style="grid-column:4" aria-hidden="true"></span></div>
<h3>Upper edge</h3><div class="dg-seg">
<div class="dg-band accept" style="grid-column:1 / span 3"><strong>Accept</strong>to 20</div>
<div class="dg-band" style="grid-column:4 / span 3"><strong>Reject</strong>21 or more</div>
<span class="dg-axis"></span><span class="dg-num" style="grid-column:1">18</span><span class="dg-num" style="grid-column:2">19</span><span class="dg-num" style="grid-column:3">20</span><span class="dg-num" style="grid-column:4">21</span><span class="dg-num" style="grid-column:5">22</span><span class="dg-num" style="grid-column:6">23</span><span class="dg-mark two" style="grid-column:3">20</span><span class="dg-mark two" style="grid-column:4">21</span><span class="dg-mark three" style="grid-column:2">19</span><span class="dg-mark three" style="grid-column:5">22</span>

<figcaption><span class="dg-title">Partitions and boundary values</span><span class="dg-note">Each band is the expected result. The rule changes at the lines.</span></figcaption>
<ul class="dg-legend"><li><span class="dg-mark two" aria-hidden="true"></span>2-value BVA</li><li><span class="dg-mark three" aria-hidden="true"></span>3-value BVA adds</li></ul>
<div class="dg2-wide"><div class="dg2-line" style="--n:21"><div class="dg2-band reject" style="grid-column:1 / 6">Reject</div><div class="dg2-band accept" style="grid-column:6 / 17">Accept</div><div class="dg2-band reject" style="grid-column:17 / 22">Reject</div><span class="dg2-num" style="grid-column:1">5</span><span class="dg2-num" style="grid-column:2">6</span><span class="dg2-num" style="grid-column:3">7</span><span class="dg2-num three" style="grid-column:4">8</span><span class="dg2-num two" style="grid-column:5">9</span><span class="dg2-num two" style="grid-column:6">10</span><span class="dg2-num three" style="grid-column:7">11</span><span class="dg2-num" style="grid-column:8">12</span><span class="dg2-num" style="grid-column:9">13</span><span class="dg2-num" style="grid-column:10">14</span><span class="dg2-num" style="grid-column:11">15</span><span class="dg2-num" style="grid-column:12">16</span><span class="dg2-num" style="grid-column:13">17</span><span class="dg2-num" style="grid-column:14">18</span><span class="dg2-num three" style="grid-column:15">19</span><span class="dg2-num two" style="grid-column:16">20</span><span class="dg2-num two" style="grid-column:17">21</span><span class="dg2-num three" style="grid-column:18">22</span><span class="dg2-num" style="grid-column:19">23</span><span class="dg2-num" style="grid-column:20">24</span><span class="dg2-num" style="grid-column:21">25</span><span class="dg-edge" style="grid-column:6" aria-hidden="true"></span><span class="dg-edge" style="grid-column:17" aria-hidden="true"></span></div></div>
<div class="dg2-narrow"><h3>Lower edge</h3><div class="dg2-line" style="--n:6"><div class="dg2-band reject" style="grid-column:1 / 4">Reject</div><div class="dg2-band accept" style="grid-column:4 / 7">Accept</div><span class="dg2-num" style="grid-column:1">7</span><span class="dg2-num three" style="grid-column:2">8</span><span class="dg2-num two" style="grid-column:3">9</span><span class="dg2-num two" style="grid-column:4">10</span><span class="dg2-num three" style="grid-column:5">11</span><span class="dg2-num" style="grid-column:6">12</span><span class="dg-edge" style="grid-column:4" aria-hidden="true"></span></div>
<h3>Upper edge</h3><div class="dg2-line" style="--n:6"><div class="dg2-band accept" style="grid-column:1 / 4">Accept</div><div class="dg2-band reject" style="grid-column:4 / 7">Reject</div><span class="dg2-num" style="grid-column:1">18</span><span class="dg2-num three" style="grid-column:2">19</span><span class="dg2-num two" style="grid-column:3">20</span><span class="dg2-num two" style="grid-column:4">21</span><span class="dg2-num three" style="grid-column:5">22</span><span class="dg2-num" style="grid-column:6">23</span><span class="dg-edge" style="grid-column:4" aria-hidden="true"></span></div></div>
</figure></div>
<h2 class="cmp-row">Risk matrix</h2><div><figure class="dg" data-card data-style="b">
<figcaption><span class="dg-title">Likelihood and impact give the risk level</span><span class="dg-note">The two checkout risks from the example, a double charge on a retried payment and a receipt layout change, placed by example ratings. Run checks in the high cells first.</span></figcaption>
<div class="dg-scroll"><table class="dg-risk"><colgroup><col class="dg-col-head"><col><col><col></colgroup><thead><tr><td></td><th scope="colgroup" colspan="3" class="dg-axis-x"><span class="dg-label">Impact</span></th></tr>
<tr><th scope="col" class="dg-corner"><span class="dg-label">Likelihood</span></th><th scope="col">Low</th><th scope="col">Medium</th><th scope="col">High</th></tr></thead>
<tbody><tr><th scope="row">High</th><td data-level="medium"><span class="dg-level">Medium</span></td><td data-level="high"><span class="dg-level">High</span></td><td data-level="high"><span class="dg-level">High</span></td></tr><tr><th scope="row">Medium</th><td data-level="low"><span class="dg-level">Low</span><span class="dg-item">Receipt layout</span></td><td data-level="medium"><span class="dg-level">Medium</span></td><td data-level="high"><span class="dg-level">High</span><span class="dg-item">Double charge</span></td></tr><tr><th scope="row">Low</th><td data-level="low"><span class="dg-level">Low</span></td><td data-level="low"><span class="dg-level">Low</span></td><td data-level="medium"><span class="dg-level">Medium</span></td></tr></tbody></table></div>
</figure></div><div><figure class="dg" data-card data-style="b2" data-diagram="risk-matrix">

<thead><tr><td></td><th scope="colgroup" colspan="3" class="dg-axis-x"><span class="dg-label">Impact</span></th></tr>
