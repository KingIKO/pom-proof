title: Senior and lead QA
role: senior
summary: Decide what the tests should cover and what must be true before release. Practice reviewing tests. Make decisions about software quality with other teams.
sections:
  - title: "Week 1: Plan what to test and when to stop"
    note: Start with how the issue affects users and what the team knows so far. Exit criteria are the conditions for ending testing. Decide what would make you change your advice about releasing.
    problems:
      - bug-report/partner-name-launch-header
      - bug-report/benefits-form-focus-trap
      - diagnosis/review-export-status-only
      - scenario/accessible-form-deadline
    questions:
      - fundamentals/test-plan-vs-strategy
      - fundamentals/absence-of-defects-fallacy
      - fundamentals/risk-based-testing
      - fundamentals/entry-exit-criteria
      - agile/three-amigos-waitlist
      - leadership/test-strategy-for-new-product
  - title: "Week 2: Review how tests work and what they cover"
    note: Ask what each test shows. Check which other tests show the same thing. Look for rules or combinations the tests miss.
    problems:
      - diagnosis/review-duplicated-draft-setup
      - diagnosis/review-payment-provider-ui
      - test-design/claim-attachment-policy
      - test-design/loan-precheck-rules
      - code/smallest-regression-suite
    questions:
      - test-design/pairwise-alert-settings
      - test-design/testing-without-requirements
      - test-design/decision-table-pickup-eligibility
      - fundamentals/testing-depends-on-context
      - leadership/balance-feedback-speed-and-coverage
  - title: "Week 3: Investigate failures that keep happening"
    note: Tell the first sign of trouble apart from what caused it. Agree on who will fix the issue. Decide how to measure whether the fix worked.
    problems:
      - diagnosis/review-shared-saved-search
      - diagnosis/notification-tests-share-account
      - diagnosis/export-sessions-pile-up
      - bug-report/offline-draft-disappears
    questions:
      - bug-reports/investigate-an-escaped-defect
      - bug-reports/measure-triage-improvement
      - flaky-tests/quarantine-with-an-owner
      - flaky-tests/measure-first-attempt-flake
      - agile/retrospective-shared-test-data
  - title: "Week 4: Risks between apps and the services they use"
    note: Work out what happens if a customer sees outdated information. Check what happens if a customer retries an action that already finished. Check what happens when a customer moves between time zones.
    problems:
      - diagnosis/review-swallowed-permission-failure
      - scenario/role-change-permissions
      - scenario/booking-time-zone-change
      - bug-report/fall-back-calendar-invite
      - scenario/mobile-offline-sync
      - scenario/refund-after-timeout
    questions:
      - bug-reports/report-a-cross-service-defect
      - test-design/verify-role-revocation
      - api/idempotency-keys
      - api/versioning-backward-compatibility
      - api/token-expiry
      - api/mock-vs-real-dependencies
  - title: "Week 5: Release gates and rollback evidence"
    note: Release gates are checks a change must pass before it reaches users. Say whether you would release when the evidence is incomplete. Explain how you would spot and respond to a failed rollout, including what would show that a rollback worked.
    problems:
      - scenario/feature-flag-release-strategy
      - scenario/data-migration-ci-gates
      - bug-report/migration-swaps-settlement-links
      - code/order-ci-checks
    questions:
      - leadership/set-release-gates
      - agile/release-go-no-go
      - test-design/prioritize-testing-before-release
      - behavioral/push-back-on-a-release
      - ci-git-docker/parity-where-it-matters
  - title: "Week 6: Lead the response and improve the system"
    note: In these rounds, practice deciding who handles each part of the response. Explain to your partners what each option costs or gives up. Decide what to measure after the fix.
    problems:
      - diagnosis/tax-quote-provider-timeout
      - test-design/monthly-renewal-date
      - test-design/sign-in-attempt-state
      - code/changed-json-paths
    questions:
      - leadership/choose-actionable-quality-metrics
      - leadership/grow-a-qa-team
      - leadership/introduce-automation-to-manual-team
      - behavioral/disagree-with-product
      - behavioral/own-a-quality-metric
      - behavioral/production-defect-you-missed
