title: SDET
role: sdet
summary: SDET stands for software development engineer in test. Practice building tools that run and support tests. Work out what happens when services fail. Check release decisions against database queries (SQL) and automatic build and test runs (CI).
sections:
  - title: "Week 1: Coding fundamentals for test data"
    note: Practice with arrays (ordered lists), sets (groups of unique values), strings (text), and small functions. Then design checks that combine data from several sources.
    problems:
      - code/classify-test-retries
      - code/balanced-log-brackets
      - code/missing-sequence-ids
      - code/redact-log-card-field
      - code/second-highest-duration
      - code/first-failing-build
      - code/first-latency-breach
    questions:
      - fundamentals/good-test-case
      - fundamentals/test-pyramid
      - fundamentals/early-testing-shift-left
      - automation-strategy/explain-your-framework
  - title: "Week 2: Set up browser tests that can run together"
    note: Browser fixtures set up what browser tests need. When sessions run at the same time, keep each session's data and state separate. Then show exactly which control the test uses.
    problems:
      - locator/pick-available-service-slot
      - locator/print-package-label
      - code/detect-booking-overlap
      - diagnosis/invite-email-collision
      - diagnosis/notification-tests-share-account
    questions:
      - playwright/context-isolation-and-backend
      - playwright/storage-state-authentication
      - playwright/shard-a-suite
      - flaky-tests/isolate-parallel-writes
      - ci-git-docker/parallelize-across-ci-jobs
  - title: "Week 3: SQL for audit trails and test reporting"
    note: An audit trail records what happened and when. Compare counts and rankings, then find the latest rows. Include ties and records with no matching test run.
    problems:
      - sql/highest-salary-per-department
      - sql/second-highest-salary
      - sql/latest-executed-run
      - sql/pass-rate-per-release
      - sql/slowest-test-per-suite
      - sql/customer-running-spend
      - sql/consecutive-sign-in-failures
      - sql/latest-audit-event-per-user
      - sql/release-cases-without-execution
    questions:
      - test-design/reconcile-filtered-report-export
      - api/pagination-coverage
      - ci-git-docker/reports-and-failure-artifacts
      - flaky-tests/measure-first-attempt-flake
  - title: "Week 4: Service contracts and retries"
    note: A service contract says how a service handles requests. If a response is missing or repeats, check what changed in the service. If another system the service depends on fails, check what the client that sent the request can still count on.
    problems:
      - scenario/api-rate-limit-window
      - code/compare-monitor-urls
      - code/summarize-response-percentiles
      - diagnosis/tax-quote-provider-timeout
      - scenario/refund-after-timeout
      - code/sliding-window-request-decisions
    questions:
      - api/http-methods-idempotency
      - api/put-vs-patch
      - api/http-conflict
      - api/too-many-requests-vs-server-error
      - api/idempotency-keys
      - api/rate-limit-boundaries
      - api/consumer-driven-contracts
      - playwright/mock-a-failing-request
      - test-design/test-payment-timeout
  - title: "Week 5: Use code to set up CI checks"
    note: Pass test settings and results to the next step in continuous integration (CI). Decide which checks need to finish first.
    problems:
      - code/flatten-config-keys
      - code/build-test-matrix
      - code/slowest-test-totals
      - code/flaky-tests-by-commit
      - code/changed-json-paths
      - code/order-ci-checks
      - code/smallest-regression-suite
    questions:
      - ci-git-docker/required-pull-request-tests
      - ci-git-docker/smoke-and-regression-schedules
      - ci-git-docker/parity-where-it-matters
      - ci-git-docker/secrets-for-test-jobs
      - leadership/balance-feedback-speed-and-coverage
  - title: "Week 6: Release controls and recovery"
    note: Decide which checks must pass before the team rolls out the release to users. A rollback returns the system to an earlier version or state. Explain how to tell if the rollback put the system back in the state you expected.
    problems:
      - locator/rerun-production-build
      - locator/reserve-live-training-slot
      - locator/resume-scheduled-regional-job
      - scenario/role-change-permissions
      - scenario/feature-flag-release-strategy
      - scenario/data-migration-ci-gates
      - bug-report/migration-swaps-settlement-links
    questions:
      - test-design/verify-role-revocation
      - leadership/set-release-gates
      - agile/release-go-no-go
      - api/debug-http-500
      - api/mock-vs-real-dependencies
